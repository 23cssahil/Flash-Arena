name: Flash Arena CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # --- Backend Checks ---
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Build & Lint Backend
        run: |
          cd backend
          npm run build

      # --- Frontend Checks ---
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_WS_URL: http://localhost:5000

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy (Backend)
        run: |
          curl -f "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" || echo "Deployment hook not configured"

      - name: Trigger Render Deploy (Frontend)
        run: |
          curl -f "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" || echo "Deployment hook not configured"
